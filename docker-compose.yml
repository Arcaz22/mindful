services:
  db:
    # Menggunakan image pgvector (berbasis Postgres 17)
    image: pgvector/pgvector:pg17
    container_name: mindful_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-mindful_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Opsional: script init untuk otomatis CREATE EXTENSION vector
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mindful_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
